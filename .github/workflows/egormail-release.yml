name: EgorMail release

# Builds the versioned bundle the CloudComputerAI control plane deploys to tenant instances
# (deploy/cloudcomputerai/build_release.py) and attaches it to a GitHub Release.
on:
  push:
    tags: ['egormail-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the egormail-v prefix, e.g. 0.1.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#egormail-v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=egormail-v$V" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build bundle
        run: python3 deploy/cloudcomputerai/build_release.py "${{ steps.v.outputs.version }}" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            "dist/egormail-${{ steps.v.outputs.version }}.tar.gz" \
            "dist/egormail-${{ steps.v.outputs.version }}.tar.gz.sha256" \
            --title "EgorMail ${{ steps.v.outputs.version }}" \
            --notes "Tenant bundle for the CloudComputerAI control plane." \
            --target "${{ github.sha }}"
